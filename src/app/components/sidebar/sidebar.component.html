<div *ngIf="isMobile" class="mobile-toggle">
  <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
    <span>Menu</span>
    <span class="burger">☰</span>
  </button>
</div>

<aside *ngIf="!isMobile" class="sidebar" [class.collapsed]="isCollapsed">
  <a routerLink="/home" class="brand" [class.centered]="isCollapsed">
    <span class="brand-mark">GD</span>
    <div class="brand-text" *ngIf="!isCollapsed">
      <strong>Gaetano</strong>
      <small>Software Engineer</small>
    </div>
  </a>

  <button class="collapse-toggle" (click)="toggleCollapse()">
    {{ isCollapsed ? '→' : '←' }}
  </button>

  <nav>
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span class="icon">01</span>
      <span class="text" *ngIf="!isCollapsed">Home</span>
    </a>

    <a routerLink="/projects" routerLinkActive="active">
      <span class="icon">02</span>
      <span class="text" *ngIf="!isCollapsed">Projects</span>
    </a>

    <a routerLink="/articles" routerLinkActive="active">
      <span class="icon">03</span>
      <span class="text" *ngIf="!isCollapsed">Articles</span>
    </a>

    <a routerLink="/about" routerLinkActive="active">
      <span class="icon">04</span>
      <span class="text" *ngIf="!isCollapsed">About me</span>
    </a>
  </nav>

  <p class="sidebar-note" *ngIf="!isCollapsed">
    Building reliable software with clean architecture and practical AI.
  </p>
</aside>

<aside *ngIf="isMobile && menuOpen" class="sidebar mobile open">
  <nav>
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      (click)="menuOpen = false">Home</a>
    <a routerLink="/projects" routerLinkActive="active" (click)="menuOpen = false">Projects</a>
    <a routerLink="/articles" routerLinkActive="active" (click)="menuOpen = false">Articles</a>
    <a routerLink="/about" routerLinkActive="active" (click)="menuOpen = false">About me</a>
  </nav>
</aside>
