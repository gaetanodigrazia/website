<div class="articles-container">
  <h2 class="heading">Articles & Research Notes</h2>
  <p class="subheading">Papers and technical write-ups spanning machine learning, quantitative systems and software
    architecture.</p>

  <div class="card-grid">
    <div class="card" *ngFor="let article of articles">
      <div class="card-body">
        <h3 class="title">{{ article.title }}</h3>
        <p class="description">{{ article.description }}</p>
        <p class="date">{{ article.date }}</p>
        <a [href]="article.pdfUrl" target="_blank" class="btn">Read PDF</a>
      </div>
    </div>
  </div>
</div>
